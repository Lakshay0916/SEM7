# Three services: ui → api → db (each waits for the next to be healthy).
#
#   docker compose up --build                         UI http://localhost:8502 · API http://localhost:8000/docs
#   (ports busy? API_PORT=8010 UI_PORT=8512 docker compose up)
#   docker compose --profile tools run --rm tests     test suite in the API image (store tests also on Postgres)
#   docker compose --profile tools run --rm cli python scripts/run_ci.py --scenario failed_first_repair --heal --approve
#   docker compose --profile agents up -d --build     + the A2A agent services (ADK + CrewAI; needs a Gemini key in .env)
#   docker compose --profile monitoring up -d         + OpenTelemetry Collector, Tempo, Prometheus, Grafana (:3000)
#                                                       (set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in .env)
#   docker compose down            (add -v to also delete the database and workspaces)

x-db-env: &db-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sem7}:${POSTGRES_PASSWORD:-sem7dev}@db:5432/${POSTGRES_DB:-sem7}
  # OpenTelemetry: off unless the endpoint is set (profile "monitoring" runs the Collector)
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SEMCONV_STABILITY_OPT_IN: http   # current HTTP metric names (http.server.request.duration)
  SEM7_ENV: ${SEM7_ENV:-local}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sem7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sem7dev}
      POSTGRES_DB: ${POSTGRES_DB:-sem7}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: sem7-api:latest
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-url
      AGENT_TRANSPORT: a2a                      # agents live in their own services (profile "agents")
      ADK_AGENT_URL: http://agent-adk:8101/
      CREW_AGENT_URL: http://agent-crew:8102/
    volumes:
      - workspace:/app/workspace   # sandbox repos and repair branches
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: sem7-ui:latest
    environment:
      SEM7_API_URL: http://api:8000
      GRAFANA_URL: ${GRAFANA_URL:-}   # "open this trace in Grafana" links, when monitoring runs
    ports:
      - "${UI_PORT:-8502}:8502"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- A2A agent services (optional): docker compose --profile agents up -d
  agent-crew:
    build:
      context: .
      dockerfile: docker/agents.Dockerfile
    image: sem7-agents:latest
    profiles: ["agents"]
    command: ["python", "-m", "app.a2a_agents.crew_service"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-url
      A2A_PORT: "8102"
      A2A_PUBLIC_URL: http://agent-crew:8102/
    volumes:
      - workspace:/app/workspace   # same sandboxes as the api: MCP tools read and dry-run them
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  agent-adk:
    image: sem7-agents:latest
    profiles: ["agents"]
    command: ["python", "-m", "app.a2a_agents.adk_service"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-url
      A2A_PORT: "8101"
      A2A_PUBLIC_URL: http://agent-adk:8101/
      CREW_AGENT_URL: http://agent-crew:8102/   # direct hand-off: ADK agent -> CrewAI agent over A2A
    volumes:
      - workspace:/app/workspace
    depends_on:
      agent-crew:
        condition: service_healthy
    restart: unless-stopped

  tests:
    image: sem7-api:latest
    profiles: ["tools"]
    environment:
      <<: *db-url
      TEST_POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-sem7}:${POSTGRES_PASSWORD:-sem7dev}@db:5432/${POSTGRES_DB:-sem7}
    command: ["python", "-m", "pytest", "-p", "no:cacheprovider", "--ignore=tests/test_ui.py"]
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: sem7-api:latest
    profiles: ["tools"]
    environment:
      <<: *db-url
    volumes:
      - workspace:/app/workspace
    command: ["python", "scripts/run_ci.py", "--list"]
    depends_on:
      db:
        condition: service_healthy

  # ---- Monitoring (optional): docker compose --profile monitoring up -d
  # Memory limits sized to fit next to the app on a 2 GB t3.small (with swap): ~830 MB at most.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: ["monitoring"]
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"                    # reads the Docker socket for per-container stats
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro                # host metrics (CPU, memory, disk, network)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0:0"                    # writes its blocks to the named volume
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
              "--web.enable-remote-write-receiver", "--enable-feature=exemplar-storage"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # on EC2 the Caddy login is the gate in front of Grafana
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor     # editors can use Explore (trace search)
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sem7-agents.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, tempo]
    mem_limit: 192m
    restart: unless-stopped

volumes:
  pgdata:
  workspace:
  tempo:
  prometheus:
  grafana:
