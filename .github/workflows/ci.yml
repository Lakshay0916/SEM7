name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Tests + risk-aware quality gate (Linux, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: # store tests also run against a real PostgreSQL
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sem7
          POSTGRES_PASSWORD: sem7ci
          POSTGRES_DB: sem7
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sem7 -d sem7"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://sem7:sem7ci@localhost:5432/sem7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the gate diffs against the base commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Quality gate (diff → ML risk → real tests → PASS / REVIEW / BLOCK)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          PR_FLAG: ${{ github.event_name == 'pull_request' && '--pull-request' || '' }}
        run: |
          python scripts/ci_gate.py --base "$BASE" $PR_FLAG \
            --summary-file "$GITHUB_STEP_SUMMARY" --json gate.json

      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: gate.json
          if-no-files-found: ignore

  tests-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  compose-stack:
    name: 3-container stack (ui + api + PostgreSQL) end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start db → api → ui (waits for health checks)
        run: docker compose up -d --wait
      - name: Container status
        run: docker compose ps
      - name: End-to-end through the API (scenario 3 → approve → reflect → approve → PR)
        run: python3 scripts/e2e_api.py --url http://localhost:8000 --ui http://localhost:8502 --expect-db postgresql
      - name: Test suite inside the api image (store tests on PostgreSQL)
        run: docker compose --profile tools run --rm tests
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  self-healing-demo:
    name: Self-healing demo (scenario 3)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Break → investigate → approve → repair → reflect → re-test → PR
        # --approve records the CI run as the approver for this demo only; the dashboard requires a human click.
        run: python scripts/run_ci.py --scenario failed_first_repair --heal --approve
      - name: Export workflow report
        run: |
          python scripts/export_report.py --latest --out healing-report.md
          cat healing-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and PR description
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-demo
          path: |
            healing-report.md
            workspace/runs/*/PR_*.md
