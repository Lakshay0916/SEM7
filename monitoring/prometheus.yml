# Prometheus: scrapes the metrics the OpenTelemetry Collector exposes (app, host and container metrics);
# Tempo also writes its service-graph / span metrics here (remote write).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
